<svg viewBox="0 0 540 340" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="display:block;border-radius:24px;overflow:hidden">
  <defs>
    <filter id="mapShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#5c0f1d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="540" height="340" rx="24" fill="#f8f1df" stroke="#d4a84b" stroke-width="1.8"/>

  <!-- Road Grid (White Bands) -->
  <!-- Vertical Main Road 1 -->
  <rect x="175" y="0" width="18" height="340" fill="#ffffff"/>
  <!-- Vertical Main Road 2 -->
  <rect x="250" y="0" width="18" height="340" fill="#ffffff"/>
  <!-- Horizontal Main Road -->
  <rect x="0" y="155" width="540" height="18" fill="#ffffff"/>

  <!-- Landscape & Plot Blocks -->
  <!-- Top Left Sandy Block -->
  <rect x="35" y="32" width="125" height="98" rx="14" fill="#e8dfce"/>
  <!-- Bottom Left Sandy Block 1 -->
  <rect x="65" y="195" width="95" height="75" rx="14" fill="#e8dfce"/>
  <!-- Bottom Center Sandy Block 2 -->
  <rect x="208" y="195" width="100" height="75" rx="14" fill="#e8dfce"/>
  
  <!-- Top Right Park Block (The White Church Grounds) -->
  <rect x="335" y="32" width="165" height="105" rx="16" fill="#d2e5cf"/>

  <!-- Bottom Right Blush / Peach Block -->
  <rect x="330" y="195" width="165" height="75" rx="14" fill="#edd5cd"/>

  <!-- Route Line (Rich Maroon Flowing Path) -->
  <path d="M 50 240 C 95 235, 115 190, 145 150 C 175 110, 220 145, 290 148 C 345 150, 365 110, 415 88" 
        fill="none" stroke="#5c0f1d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Elegant Location Marker Pin at (415, 88) -->
  <!-- Outer Gold & Maroon Pin Shadow -->
  <g transform="translate(415, 88)">
    <!-- Pin Body -->
    <path d="M 0 0 C 0 0, -22 -30, -22 -50 C -22 -66, -10 -76, 0 -76 C 10 -76, 22 -66, 22 -50 C 22 -30, 0 0, 0 0 Z" 
          fill="#5c0f1d" stroke="#d4a84b" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Inner White Accent Dot -->
    <circle cx="0" cy="-50" r="8.5" fill="#ffffff"/>
  </g>
</svg>